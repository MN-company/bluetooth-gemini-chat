name: Build IPA

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Info.plist'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS
        run: |
          xcodebuild -scheme GeminiAirBridge \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/GeminiAirBridge.app Payload/
          zip -qr GeminiAirBridge.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAirBridge.ipa
          path: GeminiAirBridge.ipa
          compression-level: 0