name: Build IPA

on:
  push:
    branches: [main, next-gen]
    paths:
      - 'GeminiAirBridge-iOS/Sources/**'
      - 'GeminiAirBridge-iOS/Package.swift'
      - 'GeminiAirBridge-iOS/Info.plist'
      - '.github/workflows/build-ipa.yml'
      - 'scripts/build_ios_ipa.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build & package IPA
        run: ./scripts/build_ios_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GeminiAirBridge.ipa
          path: GeminiAirBridge-iOS/GeminiAirBridge.ipa
          compression-level: 0